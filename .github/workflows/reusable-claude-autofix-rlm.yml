name: Reusable Claude Auto-Fix with RLM

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        type: number
      max_rlm_cost:
        description: 'Maximum cost for RLM analysis in USD'
        required: false
        type: number
        default: 5
      max_claude_turns:
        description: 'Maximum Claude turns for fix attempts'
        required: false
        type: number
        default: 30
      claude_model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'claude-opus-4-5-20251101'
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      OPENROUTER_API_KEY:
        required: true

# Prevent concurrent runs on the same issue
concurrency:
  group: claude-autofix-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  # Step 1: Run RLM codebase analysis
  rlm-analysis:
    name: RLM Codebase Analysis
    runs-on: ubuntu-latest
    outputs:
      analysis_path: ${{ steps.run-rlm.outputs.analysis_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for RLM

      - name: Check for lock label
        id: check-lock
        uses: actions/github-script@v7
        with:
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }}
            });

            const isLocked = labels.data.some(l => l.name === 'claude-working');
            if (isLocked) {
              core.setFailed('Another Claude workflow is already processing this issue');
            }

      - name: Add lock label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
              labels: ['claude-working']
            });

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install RLM
        run: npm install @cloudwarriors-ai/rlm

      - name: Run RLM Codebase Analysis
        id: run-rlm
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RLM_MAX_COST_USD: ${{ inputs.max_rlm_cost }}
        run: |
          # Create RLM analysis script (ES modules)
          cat > analyze.mjs << 'EOF'
          import { createRLM } from '@cloudwarriors-ai/rlm';
          import { readdir, readFile, writeFile } from 'node:fs/promises';

          async function analyzeCodebase() {
            // Gather all source files
            const files = await readdir('.', { recursive: true });
            const sourceFiles = files.filter(f =>
              (f.endsWith('.ts') || f.endsWith('.js') || f.endsWith('.py') ||
               f.endsWith('.java') || f.endsWith('.go') || f.endsWith('.rs')) &&
              !f.includes('node_modules') &&
              !f.includes('.git') &&
              !f.includes('dist') &&
              !f.includes('build')
            );

            console.log(`Found ${sourceFiles.length} source files`);

            // Build context with file contents
            let context = '# Codebase Structure and Content\n\n';
            for (const file of sourceFiles.slice(0, 100)) {  // Limit to 100 files
              try {
                const content = await readFile(file, 'utf-8');
                context += `\n## File: ${file}\n\`\`\`\n${content}\n\`\`\`\n`;
              } catch (err) {
                console.error(`Error reading ${file}:`, err.message);
              }
            }

            // Create RLM instance
            const rlm = createRLM({
              apiKey: process.env.OPENROUTER_API_KEY,
              model: 'anthropic/claude-sonnet-4',
              config: {
                maxRecursionDepth: 5,
                maxCostUsd: parseFloat(process.env.RLM_MAX_COST_USD) || 5.0,
                timeoutMs: 300000,
              },
            });

            // Analyze with RLM
            console.log('Starting RLM analysis...');
            const result = await rlm.query(
              context,
              `You have access to a codebase provided in the 'context' variable as a string.

              IMPORTANT: Only use these Python tools:
              - context (string variable with all file contents)
              - set_result(data) to return your analysis
              - Standard modules: json, re, collections
              - NO custom functions - use only built-in string methods and regex

              Write simple Python code to analyze the codebase and call set_result() with a JSON object.

              Analyze the context string directly using:
              - re.findall() for pattern matching
              - str.split(), str.count() for parsing
              - Basic iteration over lines

              Provide analysis with these keys:
              {
                "architecture": {
                  "layers": ["list of architectural layers found"],
                  "modules": ["main modules/directories"],
                  "mainPatterns": ["design patterns identified"]
                },
                "components": [
                  {"name": "component name", "path": "file path", "responsibility": "what it does", "dependencies": ["deps"]}
                ],
                "conventions": {
                  "naming": "naming conventions observed",
                  "errorHandling": "error handling patterns",
                  "testing": "testing approach",
                  "logging": "logging patterns"
                },
                "qualityHotspots": [
                  {"file": "path", "reason": "why it's complex", "complexity": "high/medium/low"}
                ],
                "securityPatterns": ["security measures found"],
                "recommendations": ["best practices to follow"]
              }

              Keep your Python code simple - just parse the context string and call set_result().`
            );

            if (result.success) {
              console.log(`RLM analysis complete. Cost: $${result.usage.costUsd.toFixed(4)}`);

              // Save to explicit path in GitHub workspace
              const workspacePath = process.env.GITHUB_WORKSPACE || process.cwd();
              const savedPath = `${workspacePath}/rlm-analysis.json`;

              await writeFile(savedPath, JSON.stringify({
                analysis: result.answer,
                metadata: {
                  timestamp: new Date().toISOString(),
                  filesAnalyzed: sourceFiles.length,
                  costUsd: result.usage.costUsd,
                  model: result.usage.model
                }
              }, null, 2));

              console.log(`Analysis saved to ${savedPath}`);
              console.log('Current working directory:', process.cwd());
              console.log('GITHUB_WORKSPACE:', workspacePath);

              // Verify file was written
              try {
                const stats = await readFile(savedPath, 'utf-8');
                console.log(`File verified, size: ${stats.length} bytes`);
              } catch (err) {
                console.error('File verification failed:', err);
              }

              return savedPath;
            } else {
              throw new Error(`RLM analysis failed: ${result.error}`);
            }
          }

          analyzeCodebase().catch(err => {
            console.error('Analysis failed:', err);
            process.exit(1);
          });
          EOF

          # Run analysis
          node analyze.mjs

          # Verify file exists
          echo "Checking for rlm-analysis.json in workspace..."
          ls -la rlm-analysis.json || echo "File not found!"
          pwd
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"

          # Output path
          echo "analysis_path=rlm-analysis.json" >> $GITHUB_OUTPUT

      - name: Upload RLM Analysis
        uses: actions/upload-artifact@v4
        with:
          name: rlm-analysis
          path: rlm-analysis.json
          retention-days: 7

      - name: Comment analysis complete
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
              body: '🔍 RLM codebase analysis complete. Starting adversarial fix workflow...'
            });

  # Step 2: Claude Auto-Fix with Adversarial Workflow
  claude-autofix:
    name: Claude Adversarial Auto-Fix
    needs: rlm-analysis
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download RLM Analysis
        uses: actions/download-artifact@v4
        with:
          name: rlm-analysis

      - name: Copy skills and configure Claude
        run: |
          # Clone org .github repo to get skills
          git clone https://github.com/cloudwarriors-ai/.github.git /tmp/org-github

          # Ensure .claude directory exists
          mkdir -p .claude/skills

          # Always copy skills from org (overwrite if exists)
          cp -r /tmp/org-github/.claude/skills/* .claude/skills/

          # Copy CLAUDE.md if it doesn't exist
          if [ ! -f "CLAUDE.md" ]; then
            cp /tmp/org-github/CLAUDE.md ./
          fi

          # Create Claude settings to enable skills
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json << 'EOF'
          {
            "enableAllProjectMcpServers": true,
            "enableSkills": true
          }
          EOF

          # Verify skills were copied
          echo "Skills installed:"
          ls -la .claude/skills/

      - name: Setup gh CLI authentication
        run: |
          echo "${{ github.token }}" | gh auth login --with-token
          gh auth status

      - name: Setup Claude hooks for auto-approval
        run: |
          # Create hooks directory
          mkdir -p .claude/hooks

          # Create tool-use-attempt hook to auto-approve gh commands
          cat > .claude/hooks/tool-use-attempt.sh << 'HOOK_EOF'
          #!/bin/bash
          # Auto-approve all gh commands in CI environment
          # Hook receives JSON input via stdin with tool_name and tool_input

          # Read stdin to a variable
          input=$(cat)

          # Extract tool name
          tool_name=$(echo "$input" | jq -r '.tool_name // empty')

          # If it's a Bash tool, check if command starts with 'gh'
          if [[ "$tool_name" == "Bash" ]]; then
            command=$(echo "$input" | jq -r '.tool_input.command // empty')
            if [[ "$command" =~ ^gh\  ]]; then
              echo "AUTO_APPROVE"
              exit 0
            fi
          fi

          # Default: no approval
          exit 0
          HOOK_EOF

          chmod +x .claude/hooks/tool-use-attempt.sh

          # Verify hook was created
          echo "Hook created:"
          cat .claude/hooks/tool-use-attempt.sh

          # Verify skills are present
          echo "Checking skills directory..."
          ls -la .claude/skills/ || echo "Skills directory not found!"

      - name: Run Claude with Adversarial Workflow
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Fix GitHub issue #${{ inputs.issue_number }}.

            ISSUE DETAILS:
            You can view the issue with: gh issue view ${{ inputs.issue_number }}
            The issue is in the current repository.

            CODEBASE ANALYSIS:
            RLM codebase analysis is available at: rlm-analysis.json
            Read this file first to understand the codebase architecture.

            STANDARDS:
            Follow all standards in CLAUDE.md (no compromises).

            WORKFLOW:
            If /fix-issue skill is available, use it to orchestrate the full adversarial workflow.
            Otherwise, implement the fix manually following these principles:
            1. Read the issue details
            2. Review CLAUDE.md and RLM analysis
            3. Plan the fix thoroughly
            4. Implement with clean code principles
            5. Test the changes
            6. Create a PR with detailed description

            gh CLI is authenticated and ready to use.

          claude_args: |
            --max-turns ${{ inputs.max_claude_turns }}
            --model ${{ inputs.claude_model }}
            --append-system-prompt "You are part of an adversarial quality assurance system. Mediocrity is unacceptable. Follow CLAUDE.md standards ruthlessly."
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Remove lock label
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ inputs.issue_number }},
                name: 'claude-working'
              });
            } catch (error) {
              console.log('Lock label already removed or does not exist');
            }

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
              body: `❌ Auto-fix workflow failed. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
              labels: ['needs-human-review', 'auto-fix-failed']
            });
